<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CSS Selector Benchmark: 100 Classes (.btn-primary at end)</title>
		<style>
			:root {
				--bg: #0f172a;
				--surface: #1e293b;
				--border: #475569;
				--text: #f8fafc;
				--text-muted: #94a3b8;
				--accent: #f59e0b;
			}
			body {
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				background: var(--bg);
				color: var(--text);
				padding: 2rem;
			}
			.container {
				max-width: 900px;
				margin: 0 auto;
			}
			h1 {
				margin-bottom: 0.5rem;
				color: var(--accent);
			}
			p {
				color: var(--text-muted);
				margin-bottom: 1rem;
			}
			.bench-dom-area {
				contain: layout paint style;
				position: absolute;
				left: -9999px;
				top: -9999px;
				width: 1000px;
				opacity: 0.01;
				pointer-events: none;
			}
		</style>

		<script type="module">
			import PerfTestRunner from '/lib/PerfTestRunner.js';
			import { createElement } from '/lib/DOM.js';

			const $container = document.querySelector('#container');

			const dummy98 = [];
			for (let i = 1; i <= 98; i++) dummy98.push(`tok-${String(i).padStart(3, '0')}`);
			const dummy100 = [];
			for (let i = 1; i <= 100; i++) dummy100.push(`tok-${String(i).padStart(3, '0')}`);

			const makeEnd100 = (variant) => [...dummy98, 'btn', variant].join(' ');

			const primaryClass = makeEnd100('btn-primary');
			const secondaryClass = makeEnd100('btn-secondary');
			const dangerClass = makeEnd100('btn-danger');
			const btnOnlyClass = ['tok-000', ...dummy98, 'btn'].join(' ');
			const distractorClass = dummy100.join(' ');

			// Populate 1500 elements with 100 classes (.btn-primary at end)
			const fragment = document.createDocumentFragment();
			for (let i = 0; i < 100; i++) {
				const $card = createElement('div', {
					className: `card-${i}`,
					innerHTML: `
					<button type="button" class="${primaryClass}">Primary 1</button>
					<button type="button" class="${primaryClass}">Primary 2</button>
					<a href="#" class="${secondaryClass}">Secondary</a>
					<span class="${primaryClass}">Badge 1</span>
					<span class="${primaryClass}">Badge 2</span>
					<span class="${secondaryClass}">Badge 3</span>
					<span class="${dangerClass}">Danger</span>
					<button type="button" class="${dangerClass}">Delete</button>
					<div class="${btnOnlyClass}">Button div</div>
					<span class="${btnOnlyClass}">Button span</span>
					<button type="button" class="${primaryClass}">Confirm</button>
					<span class="${secondaryClass}">Note</span>
					<div class="${distractorClass}">Distractor 1</div>
					<div class="${distractorClass}">Distractor 2</div>
					<div class="${distractorClass}">Distractor 3</div>
				`,
				});
				fragment.appendChild($card);
			}
			$container.appendChild(fragment);
			$container.offsetHeight;

			function resetCSS() {
				document.adoptedStyleSheets = [];
			}

			function setCSS(css) {
				const stylesheet = new CSSStyleSheet();
				stylesheet.replaceSync(css);
				document.adoptedStyleSheets = [stylesheet];
			}

			const selectors = {
				'.btn': '.btn',
				'[class^="btn-"]': '[class^="btn-"]',
				'[class*=" btn-"]': '[class*=" btn-"]',
				'[class^="btn-"], [class*=" btn-"]': '[class^="btn-"], [class*=" btn-"]',
			};

			const runTest = (description, selector) =>
				new Promise((resolve) => {
					PerfTestRunner.measureRunsPerSecond({
						description: `100 Classes (End): ${description}`,
						setup: () => {
							setCSS(`#container.active ${selector} { outline: 1px solid red; }`);
						},
						run: function () {
							$container.classList.toggle('active');
							$container.offsetHeight;
						},
						iterationCount: 3,
						teardown: resetCSS,
						done: resolve,
					});
				});

			const average = (array) => array.reduce((a, b) => a + b, 0) / array.length;

			window.startTest = () =>
				new Promise(async (resolve) => {
					const allResults = [];
					for (const [description, selector] of Object.entries(selectors)) {
						const testResult = await runTest(description, selector);
						allResults.push({
							description,
							selector,
							result: average(testResult),
						});
					}

					const max = Math.max(...allResults.map((r) => r.result));
					resolve(
						allResults
							.map((r) => {
								r.perc = ((r.result / max) * 100).toFixed(2) + '%';
								return r;
							})
							.sort((r1, r2) => r2.result - r1.result),
					);
				});
		</script>
	</head>

	<body>
		<div class="container">
			<h1>CSS Selector Benchmark: 100 Classes (End)</h1>
			<p>Testing <code>.btn</code>, <code>[class^="btn-"]</code>, and <code>[class*=" btn-"]</code> against elements with 100 classes where <code>.btn-primary</code> is at the end.</p>
		</div>
		<div class="bench-dom-area">
			<div id="container"></div>
		</div>
	</body>
</html>
