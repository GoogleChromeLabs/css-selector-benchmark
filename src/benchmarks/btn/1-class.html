<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CSS Selector Benchmark: .btn vs [class^="btn-"] vs [class*=" btn-"] (1 Class)</title>

		<script type="module">
			import PerfTestRunner from '../../lib/PerfTestRunner.js';
			import { createElement } from '../../lib/DOM.js';

			const $container = document.querySelector('#container');

			// Populate 1500 elements with single classes
			const fragment = document.createDocumentFragment();
			for (let i = 0; i < 100; i++) {
				const $card = createElement('div', {
					className: `card-${i}`,
					innerHTML: `
					<button type="button" class="btn-primary">Primary 1</button>
					<button type="button" class="btn-primary">Primary 2</button>
					<a href="#" class="btn-secondary">Secondary</a>
					<span class="btn-primary">Badge 1</span>
					<span class="btn-primary">Badge 2</span>
					<span class="btn-secondary">Badge 3</span>
					<span class="btn-danger">Danger</span>
					<button type="button" class="btn-danger">Delete</button>
					<div class="btn">Button div</div>
					<span class="btn">Button span</span>
					<button type="button" class="btn-primary">Confirm</button>
					<span class="btn-secondary">Note</span>
					<div class="card-item">Distractor 1</div>
					<div class="card-item">Distractor 2</div>
					<div class="card-item">Distractor 3</div>
				`,
				});
				fragment.appendChild($card);
			}
			$container.appendChild(fragment);
			$container.offsetHeight;

			function resetCSS() {
				document.adoptedStyleSheets = [];
			}

			function setCSS(css) {
				const stylesheet = new CSSStyleSheet();
				stylesheet.replaceSync(css);
				document.adoptedStyleSheets = [stylesheet];
			}

			const selectors = {
				'.btn': '.btn',
				'[class^="btn-"]': '[class^="btn-"]',
				'[class*=" btn-"]': '[class*=" btn-"]',
				'[class^="btn-"], [class*=" btn-"]': '[class^="btn-"], [class*=" btn-"]',
			};

			const runTest = (description, selector) =>
				new Promise((resolve) => {
					PerfTestRunner.measureRunsPerSecond({
						description,
						setup: () => {
							setCSS(`#container.active ${selector} { outline: 1px solid red; }`);
						},
						run: function () {
							$container.classList.toggle('active');
							$container.offsetHeight;
						},
						iterationCount: 3,
						teardown: resetCSS,
						done: resolve,
					});
				});

			const average = (array) => array.reduce((a, b) => a + b, 0) / array.length;

			window.getTests = () =>
				Object.entries(selectors).map(([description, selector]) => ({
					scenario: '1 Class',
					description: `1 Class: ${description}`,
					selector,
				}));

			window.startTest = (onResult, onStart) =>
				new Promise(async (resolve) => {
					const allResults = [];
					for (const test of window.getTests()) {
						if (typeof onStart === 'function') {
							onStart(test);
						}
						const testResult = await runTest(test.description, test.selector);
						const avg = average(testResult);
						const item = {
							scenario: test.scenario,
							description: test.description,
							selector: test.selector,
							result: Math.round(avg * 100) / 100,
						};
						allResults.push(item);
						if (typeof onResult === 'function') {
							onResult(item);
						}
					}

					const max = Math.max(...allResults.map((r) => r.result));
					resolve(
						allResults
							.map((r) => {
								r.perc = ((r.result / max) * 100).toFixed(2) + '%';
								return r;
							})
							.sort((r1, r2) => r2.result - r1.result),
					);
				});
		</script>
	</head>

	<body>
		<div id="container"></div>
	</body>
</html>
