<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>querySelectorAll Benchmark: .btn vs [class^="btn-"] vs [class*=" btn-"]</title>
		<style>
			:root {
				--bg: #0f172a;
				--surface: #1e293b;
				--border: #475569;
				--text: #f8fafc;
				--text-muted: #94a3b8;
				--accent: #10b981;
			}
			body {
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				background: var(--bg);
				color: var(--text);
				padding: 2rem;
			}
			.container {
				max-width: 900px;
				margin: 0 auto;
			}
			h1 {
				margin-bottom: 0.5rem;
				color: var(--accent);
			}
			p {
				color: var(--text-muted);
				margin-bottom: 1rem;
			}
			.bench-dom-area {
				contain: layout paint style;
				position: absolute;
				left: -9999px;
				top: -9999px;
				width: 1000px;
				opacity: 0.01;
				pointer-events: none;
			}
		</style>

		<script type="module">
			import PerfTestRunner from '/lib/PerfTestRunner.js';
			import { createElement } from '/lib/DOM.js';

			const $c1Class = document.querySelector('#container-1class');
			const $c100Start = document.querySelector('#container-100start');
			const $c100End = document.querySelector('#container-100end');

			const dummy98 = [];
			for (let i = 1; i <= 98; i++) dummy98.push(`tok-${String(i).padStart(3, '0')}`);
			const dummy100 = [];
			for (let i = 1; i <= 100; i++) dummy100.push(`tok-${String(i).padStart(3, '0')}`);

			const populate = (container, mode) => {
				const fragment = document.createDocumentFragment();
				for (let i = 0; i < 100; i++) {
					let primary = 'btn-primary';
					let secondary = 'btn-secondary';
					let btnOnly = 'btn';
					let distractor = 'distractor';

					if (mode === '100start') {
						primary = ['btn-primary', 'btn', ...dummy98].join(' ');
						secondary = ['btn-secondary', 'btn', ...dummy98].join(' ');
						btnOnly = ['btn', ...dummy98, 'tok-099'].join(' ');
						distractor = dummy100.join(' ');
					} else if (mode === '100end') {
						primary = [...dummy98, 'btn', 'btn-primary'].join(' ');
						secondary = [...dummy98, 'btn', 'btn-secondary'].join(' ');
						btnOnly = ['tok-000', ...dummy98, 'btn'].join(' ');
						distractor = dummy100.join(' ');
					}

					const $card = createElement('div', {
						className: `card-${i}`,
						innerHTML: `
						<button class="${primary}">Primary 1</button>
						<button class="${primary}">Primary 2</button>
						<a class="${secondary}">Secondary</a>
						<span class="${primary}">Badge 1</span>
						<span class="${primary}">Badge 2</span>
						<div class="${btnOnly}">Button div</div>
						<div class="${distractor}">Distractor 1</div>
						<div class="${distractor}">Distractor 2</div>
					`,
					});
					fragment.appendChild($card);
				}
				container.appendChild(fragment);
			};

			populate($c1Class, '1class');
			populate($c100Start, '100start');
			populate($c100End, '100end');

			const selectors = {
				'1 Class: document.querySelectorAll(".btn")': { root: $c1Class, selector: '.btn' },
				'1 Class: document.querySelectorAll("[class^=\\"btn-\\"])': { root: $c1Class, selector: '[class^="btn-"]' },
				'1 Class: document.querySelectorAll("[class*=\\" btn-\\"])': { root: $c1Class, selector: '[class*=" btn-"]' },

				'100 Classes (Start): document.querySelectorAll(".btn")': { root: $c100Start, selector: '.btn' },
				'100 Classes (Start): document.querySelectorAll("[class^=\\"btn-\\"])': { root: $c100Start, selector: '[class^="btn-"]' },
				'100 Classes (Start): document.querySelectorAll("[class*=\\" btn-\\"])': { root: $c100Start, selector: '[class*=" btn-"]' },

				'100 Classes (End): document.querySelectorAll(".btn")': { root: $c100End, selector: '.btn' },
				'100 Classes (End): document.querySelectorAll("[class^=\\"btn-\\"])': { root: $c100End, selector: '[class^="btn-"]' },
				'100 Classes (End): document.querySelectorAll("[class*=\\" btn-\\"])': { root: $c100End, selector: '[class*=" btn-"]' },
			};

			const runTest = (description, { root, selector }) =>
				new Promise((resolve) => {
					PerfTestRunner.measureRunsPerSecond({
						description: `QSA: ${description}`,
						run: function () {
							root.querySelectorAll(selector);
						},
						iterationCount: 3,
						done: resolve,
					});
				});

			const average = (array) => array.reduce((a, b) => a + b, 0) / array.length;

			window.startTest = () =>
				new Promise(async (resolve) => {
					const allResults = [];
					for (const [description, config] of Object.entries(selectors)) {
						const testResult = await runTest(description, config);
						allResults.push({
							description,
							selector: config.selector,
							result: average(testResult),
						});
					}

					const max = Math.max(...allResults.map((r) => r.result));
					resolve(
						allResults
							.map((r) => {
								r.perc = ((r.result / max) * 100).toFixed(2) + '%';
								return r;
							})
							.sort((r1, r2) => r2.result - r1.result),
					);
				});
		</script>
	</head>

	<body>
		<div class="container">
			<h1>querySelectorAll Benchmark: .btn vs [class^="btn-"] vs [class*=" btn-"]</h1>
			<p>Measuring <code>document.querySelectorAll()</code> speed across 1-class and 100-classes DOM subtrees.</p>
		</div>
		<div class="bench-dom-area">
			<div id="container-1class"></div>
			<div id="container-100start"></div>
			<div id="container-100end"></div>
		</div>
	</body>
</html>
