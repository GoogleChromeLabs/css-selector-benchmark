<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Test</title>
		<meta name="source" content="https://github.com/benfrain/css-performance-tests/blob/master/CSS%20Selectors/" />
		<script type="module">
			import PerfTestRunner from '/lib/PerfTestRunner.js';
			import { createElement } from '/lib/DOM.js';

			const $container = document.querySelector('#container');

			function makeTree(parentEl, numSiblings) {
				for (var i = 0; i <= numSiblings; i++) {
					$container.appendChild(
						createElement('div', {
							innerHTML: `<div>
							<div class="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"></div>
							<div class="a"></div>
						</div>`,
						}),
					);
				}
			}

			makeTree($container, 1000);
			$container.offsetHeight; // force recalc style

			function resetCSS() {
				document.adoptedStyleSheets = [];
			}
			function setCSS(css) {
				const stylesheet = new CSSStyleSheet();
				stylesheet.replaceSync(css);
				document.adoptedStyleSheets = [stylesheet];
			}

			const selectors = {
				'1. Long classname':
					'.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
				'2. Short classname': '.a',
			};

			const runTest = (description, selector) =>
				new Promise((resolve, reject) => {
					PerfTestRunner.measureRunsPerSecond({
						description: `Selector Test ${description}`,
						setup: () => {
							setCSS(`${selector} { color: red; }`);
						},
						run: function () {
							getComputedStyle($container); // force recalc style
						},
						iterationCount: 5,
						teardown: resetCSS,
						done: resolve,
					});
				});

			const average = (array) => (Array.isArray(array) ? array.reduce((a, b) => a + b, 0) / array.length : array);

			window.getTests = () =>
				Object.entries(selectors).map(([description, selector]) => ({
					scenario: 'Class Length',
					description,
					selector,
				}));

			window.startTest = (onResult, onStart) =>
				new Promise(async (resolve) => {
					const allResults = [];
					for (const test of window.getTests()) {
						if (typeof onStart === 'function') {
							onStart(test);
						}
						const testResult = await runTest(test.description, test.selector);
						const avg = average(testResult);
						const item = {
							scenario: test.scenario,
							description: test.description,
							selector: test.selector,
							result: Math.round(avg * 100) / 100,
						};
						allResults.push(item);
						if (typeof onResult === 'function') {
							onResult(item);
						}
					}
					const max = Math.max(...allResults.map((r) => r.result), 1);
					resolve(
						allResults
							.map((r) => {
								r.perc = ((r.result / max) * 100).toFixed(2) + '%';
								return r;
							})
							.sort((r1, r2) => r2.result - r1.result),
					);
				});
		</script>
	</head>

	<body>
		<div id="container"></div>
	</body>
</html>
