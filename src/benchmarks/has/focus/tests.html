<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Test - :has(:focus) Scoping &amp; Combinators</title>
		<script type="module">
			import PerfTestRunner from '../../../lib/PerfTestRunner.js';
			import { createElement } from '../../../lib/DOM.js';

			const $container = document.querySelector('#container');

			let $outer;
			let $target;
			let $directChildLink;
			let $deepChildLink;
			let $outerLink;

			function makeSubtree(parentEl, count, prefix) {
				const frag = document.createDocumentFragment();
				for (let i = 0; i < count; i++) {
					const $link = createElement('a', {
						href: '#',
						className: `link ${prefix}-link-${i}`,
						textContent: `Item ${i}`,
					});
					const $layer2 = createElement('div', {
						className: 'layer2',
						children: [$link],
					});
					const $layer1 = createElement('div', {
						className: 'layer1',
						children: [$layer2],
					});
					const $item = createElement('div', {
						className: `item ${prefix}-item-${i}`,
						children: [$layer1],
					});
					frag.appendChild($item);
				}
				parentEl.appendChild(frag);
			}

			function buildDOM() {
				$container.replaceChildren();
				$outer = createElement('div', { id: 'outer' });
				$target = createElement('div', { id: 'target' });
				$container.append($outer, $target);

				makeSubtree($outer, 500, 'outer');
				$directChildLink = createElement('a', {
					id: 'direct-link',
					href: '#',
					className: 'link direct-link',
					textContent: 'Direct Child Link',
				});
				$target.appendChild($directChildLink);
				makeSubtree($target, 500, 'target');

				$deepChildLink = $target.querySelector('.target-link-499');
				$outerLink = $outer.querySelector('.outer-link-499');
			}

			const selectors = [
				{
					description: ':root prefix with child combinator (>) (:focus)',
					selector: ':root:has(> :focus)',
				},
				{
					description: ':root prefix with child combinator (>) (a:focus)',
					selector: ':root:has(> a:focus)',
				},
				{
					description: ':root prefix with descendant combinator (:focus)',
					selector: ':root:has(:focus)',
				},
				{
					description: ':root prefix with descendant combinator (a:focus)',
					selector: ':root:has(a:focus)',
				},
				{
					description: '#target prefix with child combinator (>) (:focus)',
					selector: '#target:has(> :focus)',
				},
				{
					description: '#target prefix with child combinator (>) (a:focus)',
					selector: '#target:has(> a:focus)',
				},
				{
					description: '#target prefix with descendant combinator (:focus)',
					selector: '#target:has(:focus)',
				},
				{
					description: '#target prefix with descendant combinator (a:focus)',
					selector: '#target:has(a:focus)',
				},
				{
					description: 'Repeated #target inside :has() with descendant combinator (:focus)',
					selector: '#target:has(#target :focus)',
				},
				{
					description: 'Repeated #target inside :has() with descendant combinator (a:focus)',
					selector: '#target:has(#target a:focus)',
				},
				{
					description: 'Repeated #target inside :has() with child combinator (>) (:focus)',
					selector: '#target:has(#target > :focus)',
				},
				{
					description: 'Repeated #target inside :has() with child combinator (>) (a:focus)',
					selector: '#target:has(#target > a:focus)',
				},
			];

			function resetCSS() {
				document.adoptedStyleSheets = [];
			}

			function setCSS(css) {
				const stylesheet = new CSSStyleSheet();
				stylesheet.replaceSync(css);
				document.adoptedStyleSheets = [stylesheet];
			}

			const runFocusToggleTest = (description, selector, getEl) =>
				new Promise((resolve) => {
					let $el;
					PerfTestRunner.measureRunsPerSecond({
						description: `Selector Test ${description}`,
						setup: () => {
							buildDOM();
							setCSS(`${selector} { outline-color: red; }`);
							$el = getEl();
							window.getComputedStyle($target).outlineColor;
						},
						run: function () {
							$el.focus();
							window.getComputedStyle($target).outlineColor;
							$el.blur();
							window.getComputedStyle($target).outlineColor;
						},
						iterationCount: 3,
						teardown: () => {
							resetCSS();
							$container.replaceChildren();
						},
						done: resolve,
					});
				});

			const average = (array) => (Array.isArray(array) ? array.reduce((a, b) => a + b, 0) / array.length : array);

			window.getTests = () => [
				...selectors.map((s) => ({
					scenario: '1. Direct Child Focus (#target > a)',
					description: `Direct Focus: ${s.description}`,
					selector: s.selector,
					mode: 'direct',
				})),
				...selectors.map((s) => ({
					scenario: '2. Deep Descendant Focus (#target .deep a)',
					description: `Deep Focus: ${s.description}`,
					selector: s.selector,
					mode: 'deep',
				})),
				...selectors.map((s) => ({
					scenario: '3. Outer Element Focus (#outer a)',
					description: `Outer Focus: ${s.description}`,
					selector: s.selector,
					mode: 'outer',
				})),
			];

			window.startTest = (onResult, onStart) =>
				new Promise(async (resolve) => {
					const allResults = [];
					for (const test of window.getTests()) {
						if (typeof onStart === 'function') {
							onStart(test);
						}
						let testResult;
						if (test.mode === 'direct') {
							testResult = await runFocusToggleTest(test.description, test.selector, () => $directChildLink);
						} else if (test.mode === 'deep') {
							testResult = await runFocusToggleTest(test.description, test.selector, () => $deepChildLink);
						} else {
							testResult = await runFocusToggleTest(test.description, test.selector, () => $outerLink);
						}
						const avg = average(testResult);
						const item = {
							scenario: test.scenario,
							description: test.description,
							selector: test.selector,
							result: Math.round(avg * 100) / 100,
						};
						allResults.push(item);
						if (typeof onResult === 'function') {
							onResult(item);
						}
					}
					const max = Math.max(...allResults.map((r) => r.result), 1);
					resolve(
						allResults.map((r) => {
							r.perc = ((r.result / max) * 100).toFixed(2) + '%';
							return r;
						}),
					);
				});
		</script>
	</head>
	<body>
		<div id="container"></div>
	</body>
</html>
