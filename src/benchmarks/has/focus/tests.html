<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Test - :has(:focus) Scoping &amp; Combinators</title>
		<script type="module">
			import PerfTestRunner from '../../../lib/PerfTestRunner.js';
			import { createElement } from '../../../lib/DOM.js';

			const $container = document.querySelector('#container');

			let $outer;
			let $target;
			let $directChildBtn;
			let $deepChildBtn;
			let $outerBtn;

			function makeSubtree(parentEl, count, prefix) {
				const frag = document.createDocumentFragment();
				for (let i = 0; i < count; i++) {
					const $btn = createElement('button', {
						type: 'button',
						className: `btn ${prefix}-btn-${i}`,
						textContent: `Item ${i}`,
					});
					const $layer2 = createElement('div', {
						className: 'layer2',
						children: [$btn],
					});
					const $layer1 = createElement('div', {
						className: 'layer1',
						children: [$layer2],
					});
					const $item = createElement('div', {
						className: `item ${prefix}-item-${i}`,
						children: [$layer1],
					});
					frag.appendChild($item);
				}
				parentEl.appendChild(frag);
			}

			function buildDOM() {
				$container.replaceChildren();
				$outer = createElement('div', { id: 'outer' });
				$target = createElement('div', { id: 'target' });
				$container.append($outer, $target);

				makeSubtree($outer, 500, 'outer');
				$directChildBtn = createElement('button', {
					id: 'direct-btn',
					type: 'button',
					className: 'btn direct-btn',
					textContent: 'Direct Child Button',
				});
				$target.appendChild($directChildBtn);
				makeSubtree($target, 500, 'target');

				$deepChildBtn = $target.querySelector('.target-btn-499');
				$outerBtn = $outer.querySelector('.outer-btn-499');
			}

			const selectors = [
				{
					description: ':root prefix with child combinator (>)',
					selector: ':root:has(> :focus)',
				},
				{
					description: ':root prefix with descendant combinator',
					selector: ':root:has(:focus)',
				},
				{
					description: '#target prefix with child combinator (>)',
					selector: '#target:has(> :focus)',
				},
				{
					description: '#target prefix with descendant combinator',
					selector: '#target:has(:focus)',
				},
				{
					description: 'Repeated #target inside :has() with descendant combinator',
					selector: '#target:has(#target :focus)',
				},
				{
					description: 'Repeated #target inside :has() with child combinator (>)',
					selector: '#target:has(#target > :focus)',
				},
			];

			function resetCSS() {
				document.adoptedStyleSheets = [];
			}

			function setCSS(css) {
				const stylesheet = new CSSStyleSheet();
				stylesheet.replaceSync(css);
				document.adoptedStyleSheets = [stylesheet];
			}

			const runFocusToggleTest = (description, selector, getBtn) =>
				new Promise((resolve) => {
					let $btn;
					PerfTestRunner.measureRunsPerSecond({
						description: `Selector Test ${description}`,
						setup: () => {
							buildDOM();
							setCSS(`${selector} { outline-color: red; }`);
							$btn = getBtn();
							window.getComputedStyle($target).outlineColor;
						},
						run: function () {
							$btn.focus();
							window.getComputedStyle($target).outlineColor;
							$btn.blur();
							window.getComputedStyle($target).outlineColor;
						},
						iterationCount: 3,
						teardown: () => {
							resetCSS();
							$container.replaceChildren();
						},
						done: resolve,
					});
				});

			const average = (array) => (Array.isArray(array) ? array.reduce((a, b) => a + b, 0) / array.length : array);

			window.getTests = () => [
				...selectors.map((s) => ({
					scenario: '1. Direct Child Focus (#target > button)',
					description: `Direct Focus: ${s.description}`,
					selector: s.selector,
					mode: 'direct',
				})),
				...selectors.map((s) => ({
					scenario: '2. Deep Descendant Focus (#target .deep button)',
					description: `Deep Focus: ${s.description}`,
					selector: s.selector,
					mode: 'deep',
				})),
				...selectors.map((s) => ({
					scenario: '3. Outer Element Focus (#outer button)',
					description: `Outer Focus: ${s.description}`,
					selector: s.selector,
					mode: 'outer',
				})),
			];

			window.startTest = (onResult, onStart) =>
				new Promise(async (resolve) => {
					const allResults = [];
					for (const test of window.getTests()) {
						if (typeof onStart === 'function') {
							onStart(test);
						}
						let testResult;
						if (test.mode === 'direct') {
							testResult = await runFocusToggleTest(test.description, test.selector, () => $directChildBtn);
						} else if (test.mode === 'deep') {
							testResult = await runFocusToggleTest(test.description, test.selector, () => $deepChildBtn);
						} else {
							testResult = await runFocusToggleTest(test.description, test.selector, () => $outerBtn);
						}
						const avg = average(testResult);
						const item = {
							scenario: test.scenario,
							description: test.description,
							selector: test.selector,
							result: Math.round(avg * 100) / 100,
						};
						allResults.push(item);
						if (typeof onResult === 'function') {
							onResult(item);
						}
					}
					const max = Math.max(...allResults.map((r) => r.result), 1);
					resolve(
						allResults.map((r) => {
							r.perc = ((r.result / max) * 100).toFixed(2) + '%';
							return r;
						}),
					);
				});
		</script>
	</head>
	<body>
		<div id="container"></div>
	</body>
</html>
