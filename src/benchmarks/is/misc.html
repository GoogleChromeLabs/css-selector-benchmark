<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="source" content="https://front-end.social/@bramus/111794101191771782" />
		<title>:is()</title>
		<script type="module">
			import PerfTestRunner from '../../lib/PerfTestRunner.js';
			import { createElement } from '../../lib/DOM.js';

			const $container = document.querySelector('#container');

			function makeTree(parentEl, numSiblings) {
				for (var i = 0; i <= numSiblings; i++) {
					$container.appendChild(
						createElement('div', {
							className: `tagDiv wrap${i}`,
							innerHTML: `<div class="tagDiv layer1" data-div="layer1">
										<div class="tagDiv layer2">
											<ul class="tagUl">
												<li class="tagLi"><b class="tagB"><a href="/" class="tagA link" data-select="link">Select</a></b></li>
											</ul>
										</div>
									</div>`,
						}),
					);
				}
			}

			makeTree($container, 1000);
			$container.offsetHeight; // force recalc style

			function resetCSS() {
				document.adoptedStyleSheets = [];
			}
			function setCSS(css) {
				const stylesheet = new CSSStyleSheet();
				stylesheet.replaceSync(css);
				document.adoptedStyleSheets = [stylesheet];
			}

			const selectors = {
				'ul:is(.tagDiv .layer2 *):is(ul)': 'ul:is(.tagDiv .layer2 *):is(ul)',
				'ul:is(.tagDiv .layer2 ul)': 'ul:is(.tagDiv .layer2 ul)',

				'ul:where(.tagDiv .layer2 *):where(ul)': 'ul:where(.tagDiv .layer2 *):where(ul)',
				'ul:where(.tagDiv .layer2 ul)': 'ul:where(.tagDiv .layer2 ul)',

				'.tagDiv .layer2 ul': '.tagDiv .layer2 ul',
				':is(.tagDiv .layer2 ul)': ':is(.tagDiv .layer2 ul)',
				':where(.tagDiv .layer2 ul)': ':where(.tagDiv .layer2 ul)',
			};

			const runTest = (description, selector) =>
				new Promise((resolve, reject) => {
					PerfTestRunner.measureRunsPerSecond({
						description: `Selector Test ${description}`,
						setup: () => {
							setCSS(`#container.active ${selector} { outline: 1px solid red; }`);
						},
						run: function () {
							$container.classList.toggle('active');
							getComputedStyle($container).getPropertyValue('--trigger'); // Trigger style invalidation
						},
						iterationCount: 2,
						tearDown: resetCSS,
						done: (results) => {
							resolve(results);
						},
					});
				});

			const average = (array) => (Array.isArray(array) ? array.reduce((a, b) => a + b, 0) / array.length : array);

			window.getTests = () =>
				Object.entries(selectors).map(([description, selector]) => ({
					scenario: 'Compound Selectors',
					description: 'Compound: ' + description,
					selector,
				}));

			window.startTest = (onResult, onStart) =>
				new Promise(async (resolve) => {
					const allResults = [];
					for (const test of window.getTests()) {
						if (typeof onStart === 'function') {
							onStart(test);
						}
						const testResult = await runTest(test.description, test.selector);
						const avg = average(testResult);
						const item = {
							scenario: test.scenario,
							description: test.description,
							selector: test.selector,
							result: Math.round(avg * 100) / 100,
						};
						allResults.push(item);
						if (typeof onResult === 'function') {
							onResult(item);
						}
					}
					const max = Math.max(...allResults.map((r) => r.result), 1);
					resolve(
						allResults
							.map((r) => {
								r.perc = ((r.result / max) * 100).toFixed(2) + '%';
								return r;
							})
							.sort((r1, r2) => r2.result - r1.result),
					);
				});
		</script>
	</head>

	<body>
		<div id="container"></div>
	</body>
</html>
