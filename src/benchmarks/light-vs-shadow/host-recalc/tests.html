<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Test - Light vs. Shadow DOM: Host State Recalc</title>
		<script type="module">
			import PerfTestRunner from '../../../lib/PerfTestRunner.js';
			import { buildComponentCSS, createLightInstance, createShadowInstance, createSeamInstance } from '../helpers.js';

			const $container = document.querySelector('#container');
			const NUM_INSTANCES = 500;

			const lightCSS20 = buildComponentCSS(19, 'light');
			const lightCSS40 = buildComponentCSS(39, 'light');
			const shadowCSS20 = buildComponentCSS(19, 'shadow');
			const shadowCSS40 = buildComponentCSS(39, 'shadow');
			const seamCSS20 = buildComponentCSS(19, 'seam');
			const seamCSS40 = buildComponentCSS(39, 'seam');

			const sharedSheet20 = new CSSStyleSheet();
			sharedSheet20.replaceSync(shadowCSS20);

			const sharedSheet40 = new CSSStyleSheet();
			sharedSheet40.replaceSync(shadowCSS40);

			const seamSheet20 = new CSSStyleSheet();
			seamSheet20.replaceSync(seamCSS20);

			const seamSheet40 = new CSSStyleSheet();
			seamSheet40.replaceSync(seamCSS40);

			const lightSheet20 = new CSSStyleSheet();
			lightSheet20.replaceSync(lightCSS20);

			const lightSheet40 = new CSSStyleSheet();
			lightSheet40.replaceSync(lightCSS40);

			let instances = [];

			function mountInstances(factoryFn) {
				$container.innerHTML = '';
				instances = [];
				const frag = document.createDocumentFragment();
				for (let i = 0; i < NUM_INSTANCES; i++) {
					const el = factoryFn();
					instances.push(el);
					frag.appendChild(el);
				}
				$container.appendChild(frag);
				window.getComputedStyle($container).color;
			}

			function toggleAllActive() {
				for (let i = 0; i < instances.length; i++) {
					instances[i].classList.add('active');
				}
				window.getComputedStyle($container).color;
				for (let i = 0; i < instances.length; i++) {
					instances[i].classList.remove('active');
				}
				window.getComputedStyle($container).color;
			}

			const tests = [
				{
					scenario: 'Host State Recalc (500 instances)',
					description: '20 Light DOM nodes (.comp.active .n1..n19)',
					selector: '20 Light (10k total nodes)',
					setup: () => {
						document.adoptedStyleSheets = [lightSheet20];
						mountInstances(() => createLightInstance(20));
					},
					run: toggleAllActive,
				},
				{
					scenario: 'Host State Recalc (500 instances)',
					description: '1 Light + 19 Shadow (:host(.active) .n1..n19)',
					selector: '1+19 Shadow (Shared CSS)',
					setup: () => {
						document.adoptedStyleSheets = [];
						mountInstances(() => createShadowInstance(20, sharedSheet20));
					},
					run: toggleAllActive,
				},
				{
					scenario: 'Host State Recalc (500 instances)',
					description: '1 Light + 19 Shadow (<style> tag)',
					selector: '1+19 Shadow (Inline <style>)',
					setup: () => {
						document.adoptedStyleSheets = [];
						mountInstances(() => createShadowInstance(20, null, shadowCSS20));
					},
					run: toggleAllActive,
				},
				{
					scenario: 'Host State Recalc (500 instances)',
					description: '1 Host + 10 Shadow + 9 Slotted (::slotted)',
					selector: '10 Light + 10 Shadow (Seam)',
					setup: () => {
						document.adoptedStyleSheets = [];
						mountInstances(() => createSeamInstance(20, seamSheet20));
					},
					run: toggleAllActive,
				},
				{
					scenario: 'Host State Recalc (500 instances)',
					description: '40 Light DOM nodes (.comp.active .n1..n39)',
					selector: '40 Light (20k total nodes)',
					setup: () => {
						document.adoptedStyleSheets = [lightSheet40];
						mountInstances(() => createLightInstance(40));
					},
					run: toggleAllActive,
				},
				{
					scenario: 'Host State Recalc (500 instances)',
					description: '1 Light + 39 Shadow (:host(.active) .n1..n39)',
					selector: '1+39 Shadow (Shared CSS)',
					setup: () => {
						document.adoptedStyleSheets = [];
						mountInstances(() => createShadowInstance(40, sharedSheet40));
					},
					run: toggleAllActive,
				},
				{
					scenario: 'Host State Recalc (500 instances)',
					description: '1 Light + 39 Shadow (<style> tag)',
					selector: '1+39 Shadow (Inline <style>)',
					setup: () => {
						document.adoptedStyleSheets = [];
						mountInstances(() => createShadowInstance(40, null, shadowCSS40));
					},
					run: toggleAllActive,
				},
				{
					scenario: 'Host State Recalc (500 instances)',
					description: '1 Host + 20 Shadow + 19 Slotted (::slotted)',
					selector: '20 Light + 20 Shadow (Seam)',
					setup: () => {
						document.adoptedStyleSheets = [];
						mountInstances(() => createSeamInstance(40, seamSheet40));
					},
					run: toggleAllActive,
				},
			];

			const average = (array) => (Array.isArray(array) ? array.reduce((a, b) => a + b, 0) / array.length : array);

			window.getTests = () =>
				tests.map((t) => ({
					scenario: t.scenario,
					description: t.description,
					selector: t.selector,
				}));

			window.startTest = (onResult, onStart) =>
				new Promise(async (resolve) => {
					const allResults = [];
					for (const test of tests) {
						if (typeof onStart === 'function') {
							onStart(test);
						}
						const res = await new Promise((resDone) => {
							PerfTestRunner.measureRunsPerSecond({
								description: test.description,
								setup: test.setup,
								run: test.run,
								iterationCount: 3,
								teardown: () => {
									$container.innerHTML = '';
									instances = [];
									document.adoptedStyleSheets = [];
								},
								done: resDone,
							});
						});
						const avg = average(res);
						const item = {
							scenario: test.scenario,
							description: test.description,
							selector: test.selector,
							result: Math.round(avg * 100) / 100,
						};
						allResults.push(item);
						if (typeof onResult === 'function') {
							onResult(item);
						}
					}
					const max = Math.max(...allResults.map((r) => r.result), 1);
					resolve(
						allResults.map((r) => {
							r.perc = ((r.result / max) * 100).toFixed(2) + '%';
							return r;
						}),
					);
				});
		</script>
	</head>
	<body>
		<div id="container"></div>
	</body>
</html>
